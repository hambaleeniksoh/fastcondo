
<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fastcondo</title>

  <!-- เชื่อมต่อไฟล์ CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========================================
       1. ส่วนหัวเว็บไซต์
  ======================================== -->

  <h1>Fastcondo</h1>

  <p>ค้นหาคอนโดที่เหมาะกับคุณ</p>


  <!-- ========================================
       2. ระบบค้นหาและตัวกรองงบประมาณ
  ======================================== -->

  <section id="searchSection">

    <input
      type="text"
      id="searchInput"
      placeholder="กรอกชื่อคอนโดหรือทำเล"
    >

    <button type="button" id="searchButton">
      ค้นหา
    </button>

    <label for="priceFilter">
      งบประมาณค่าเช่า
    </label>

    <select id="priceFilter">
      <option value="all">ทุกงบประมาณ</option>
      <option value="10000">ไม่เกิน 10,000 บาท</option>
      <option value="15000">10,001 - 15,000 บาท</option>
      <option value="above15000">มากกว่า 15,000 บาท</option>
    </select>

    <!-- แสดงข้อความผลการค้นหา -->
    <p id="searchMessage"></p>

    <!-- พื้นที่สำรองสำหรับผลลัพธ์เพิ่มเติม -->
    <div id="listingResults"></div>

  </section>


  <!-- ========================================
       3. ส่วนเพิ่มคอนโดใหม่
  ======================================== -->

  <section id="addCondoSection">

    <h2>เพิ่มคอนโดใหม่ 🏢</h2>

    <p>กรอกข้อมูลคอนโดที่ต้องการเพิ่มลงในระบบ</p>

    <form id="addCondoForm">

      <label for="condoNameInput">
        ชื่อคอนโด
      </label>

      <input
        type="text"
        id="condoNameInput"
        placeholder="เช่น สุขุมวิท เรสซิเดนซ์"
        required
      >

      <label for="condoLocationInput">
        ทำเล
      </label>

      <input
        type="text"
        id="condoLocationInput"
        placeholder="เช่น อโศก"
        required
      >

      <label for="condoPriceInput">
        ค่าเช่าต่อเดือน (บาท)
      </label>

      <input
        type="number"
        id="condoPriceInput"
        placeholder="เช่น 12000"
        min="1"
        step="1"
        required
      >

      <button
        type="submit"
        id="addCondoButton"
      >
        เพิ่มคอนโด
      </button>

      <p id="addCondoMessage"></p>

    </form>

  </section>


  <!-- ========================================
       4. พื้นที่แสดงรายการคอนโด
  ======================================== -->

  <section id="condoSection">

    <h2>คอนโดแนะนำ</h2>

    <!-- JavaScript จะสร้างการ์ดคอนโดในพื้นที่นี้ -->
    <div id="condoResults"></div>

  </section>


  <!-- ========================================
       5. ส่วนรายการโปรด
  ======================================== -->

  <section id="favoritesSection">

    <h2>คอนโดโปรด ❤️</h2>

    <p id="favoritesMessage"></p>

    <!-- JavaScript จะแสดงการ์ดรายการโปรดที่นี่ -->
    <div id="favoritesResults"></div>

  </section>


  <!-- ========================================
       6. ฟอร์มแก้ไขข้อมูลคอนโด
  ======================================== -->

  <section id="editCondoSection" hidden>

    <h2>แก้ไขข้อมูลคอนโด</h2>

    <form id="editCondoForm">

      <!-- เก็บ ID ของคอนโดที่กำลังแก้ไข -->
      <input
        type="hidden"
        id="editCondoId"
      >

      <label for="editCondoName">
        ชื่อคอนโด
      </label>

      <input
        type="text"
        id="editCondoName"
        required
      >

      <label for="editCondoLocation">
        ทำเล
      </label>

      <input
        type="text"
        id="editCondoLocation"
        required
      >

      <label for="editCondoPrice">
        ราคาเช่า (บาท/เดือน)
      </label>

      <input
        type="number"
        id="editCondoPrice"
        min="1"
        step="1"
        required
      >

      <div class="form-actions">

        <button type="submit">
          บันทึกการแก้ไข
        </button>

        <button
          type="button"
          id="cancelEditButton"
        >
          ยกเลิก
        </button>

      </div>

      <p id="editCondoMessage"></p>

    </form>

  </section>


  <!-- ========================================
       7. ส่วนแสดงรายละเอียดคอนโด
  ======================================== -->

  <section id="condoDetail" hidden>

    <h2>รายละเอียดคอนโด</h2>

    <h3 id="detailName"></h3>

    <p id="detailLocation"></p>

    <p id="detailPrice"></p>

    <button
      type="button"
      id="closeDetailButton"
    >
      ปิดรายละเอียด
    </button>

  </section>


  <!-- ========================================
       8. หน้าต่างยืนยันการลบคอนโด
  ======================================== -->

  <section id="deleteConfirmModal" hidden>

    <div class="modal-overlay">

      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="deleteModalTitle"
      >

        <h2 id="deleteModalTitle">
          ยืนยันการลบคอนโด
        </h2>

        <p>
          คุณต้องการลบคอนโดรายการนี้ใช่หรือไม่?
        </p>

        <!-- แสดงชื่อคอนโดที่จะลบ -->
        <p id="deleteCondoName"></p>

        <p>
          การดำเนินการนี้จะไม่สามารถย้อนกลับได้
        </p>

        <div class="form-actions">

          <button
            type="button"
            id="confirmDeleteButton"
          >
            ยืนยันการลบ
          </button>

          <button
            type="button"
            id="cancelDeleteButton"
          >
            ยกเลิก
          </button>

        </div>

        <p id="deleteMessage"></p>

      </div>

    </div>

  </section>


  <!-- ========================================
       9. เชื่อมต่อ JavaScript
  ======================================== -->

  <script src="script.js"></script>

</body>
</html>
